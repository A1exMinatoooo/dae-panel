name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Resolve Version
        shell: bash
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || printf 'dev')"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build Frontend
        run: |
          cd web
          npm ci
          VITE_APP_VERSION="${VERSION}" npm run build

      - name: Build Backend
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -ldflags="-X github.com/daeuniverse/dae-panel/internal/version.Version=${VERSION}" -o dae-panel .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dae-panel-linux-amd64
          path: dae-panel
